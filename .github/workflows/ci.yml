name: ci

on:
    push:
        branches: ['**']

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              env:
                  HUSKY: '0'

            - run: npm run check
