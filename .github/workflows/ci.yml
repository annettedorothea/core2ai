name: ci

# Push to main: early feedback while hacking (core has no consumer link-pin issues).
# Release quality gate (check + test before npm publish): publish.yml on tag v*.

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              env:
                  HUSKY: '0'

            - run: npm run check
            - run: npm run test
